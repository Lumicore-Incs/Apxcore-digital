  <title>Plane Trails · alternate spin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #01060A;
      font-family: system-ui, sans-serif;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #01060A 0%, #032739 100%);
      cursor: none;
      touch-action: none;
    }
    #trails {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }
    #plane {
      position: absolute;
      top: 0;
      left: 0;
      width: 300px !important;
      height: 250px !important;
      pointer-events: auto;
      transform-origin: center center;
      transition: none;
      will-change: transform;
      filter: drop-shadow(0 0 12px rgba(0, 189, 253, 0.6));
      cursor: pointer;
    }
    #plane circle {
      filter: drop-shadow(0 0 12px #00BDFD);
    }
    #plane path {
      filter: drop-shadow(0 0 4px #00BDFD);
    }
  </style>
</head>

<script>
  (function() {
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('trails');
    const planeSVG = document.getElementById('plane');
    const ctx = canvas.getContext('2d');

    // ----- sizing -----
    function resize() {
      canvas.width = stage.clientWidth;
      canvas.height = stage.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ----- fixed plane size -----
    const PLANE_WIDTH = 300;
    const PLANE_HEIGHT = 250;

    // ----- position & motion -----
    let px = stage.clientWidth * 0.82;
    let py = stage.clientHeight * 0.18;
    let tx = px, ty = py;
    let vx = 0, vy = 0;
    let rot = 0;
    let spinVelocity = 0;
    let spinDirection = 1; // 1 = forward (clockwise), -1 = backward (counter-clockwise)
    let scale = 1;

    // ----- particles -----
    const particles = [];

    // engine offsets in SVG viewBox (800x600) relative to center (400,300)
    const engineOffsets = [
      { dx: 0, dy: 25 },
      { dx: -75, dy: 40 },
      { dx: 76, dy: 40 }
    ];

    function getEnginePositions(rad) {
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      const sx = PLANE_WIDTH / 800;
      const sy = PLANE_HEIGHT / 600;
      const pts = [];
      for (let i = 0; i < engineOffsets.length; i++) {
        const dxPx = engineOffsets[i].dx * sx;
        const dyPx = engineOffsets[i].dy * sy;
        const rdx = dxPx * cos - dyPx * sin;
        const rdy = dxPx * sin + dyPx * cos;
        pts.push({ x: px + rdx, y: py + rdy });
      }
      return pts;
    }

    function spawnParticle(x, y, angle, speed) {
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1.0
      });
    }

    // ----- mouse / touch (movement) -----
    function handleMove(clientX, clientY) {
      const rect = stage.getBoundingClientRect();
      tx = clientX - rect.left;
      ty = clientY - rect.top;
      tx = Math.min(stage.clientWidth, Math.max(0, tx));
      ty = Math.min(stage.clientHeight, Math.max(0, ty));
    }

    stage.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
    stage.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      if (t) handleMove(t.clientX, t.clientY);
    }, { passive: false });
    stage.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if (t) handleMove(t.clientX, t.clientY);
    }, { passive: true });

    // ----- CLICK / TAP: alternate spin direction -----
    function handleClick(e) {
      // alternate direction: forward -> backward -> forward -> ...
      spinDirection *= -1;
      
      // spin amount: 180 to 360 degrees in radians
      const spinAmount = (Math.PI + Math.random() * Math.PI) * spinDirection;
      spinVelocity += spinAmount * 0.3;
      
      // small visual feedback: slight scale pulse (optional)
    }

    // Attach click to the plane SVG
    planeSVG.addEventListener('click', handleClick);
    planeSVG.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleClick(e);
    }, { passive: false });

    // ----- animation loop -----
    let lastTime = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTime) / 16.6, 3);
      lastTime = now;

      // smooth follow
      px += (tx - px) * 0.12 * dt;
      py += (ty - py) * 0.12 * dt;

      // velocity for banking
      const newVx = tx - px;
      const newVy = ty - py;
      vx = vx * 0.8 + newVx * 0.2;
      vy = vy * 0.8 + newVy * 0.2;

      // banking from movement (max ±35°)
      const bankTarget = Math.max(-35, Math.min(35, vx * 1.2));
      const bankRad = bankTarget * Math.PI / 180;

      // ----- SPIN from click: smooth decay -----
      spinVelocity *= 0.96; // friction
      if (Math.abs(spinVelocity) < 0.001) spinVelocity = 0;

      // add spin to rotation
      rot += spinVelocity * dt * 0.5;

      // gradually return to banking when spin is almost done
      if (Math.abs(spinVelocity) < 0.05) {
        const diff = bankRad - rot;
        rot += diff * 0.08 * dt;
      }

      // apply rotation & fixed size
      planeSVG.style.width = PLANE_WIDTH + 'px';
      planeSVG.style.height = PLANE_HEIGHT + 'px';
      planeSVG.style.transform = `translate(${px - PLANE_WIDTH/2}px, ${py - PLANE_HEIGHT/2}px) rotate(${rot * 180 / Math.PI}deg)`;

      // ---- spawn trails ----
      const rad = rot;
      const backAngle = rad + Math.PI;
      const enginePoints = getEnginePositions(rad);

      for (let i = 0; i < enginePoints.length; i++) {
        const pt = enginePoints[i];
        const angleOffset = (Math.random() - 0.5) * 0.4;
        const ang = backAngle + angleOffset;
        const speed = 0.6 + Math.random() * 0.8;
        spawnParticle(pt.x, pt.y, ang, speed);
      }

      // ---- draw trails ----
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = 'lighter';

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 0.01 * dt;
        p.life -= 0.012 * dt;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        const radius = 3 * p.life + 0.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 189, 253, ${p.life * 0.8})`;
        ctx.fill();
      }

      ctx.globalCompositeOperation = 'source-over';

      if (particles.length > 600) {
        particles.splice(0, particles.length - 600);
      }

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);

    window.addEventListener('resize', () => {
      tx = Math.min(stage.clientWidth, Math.max(0, tx));
      ty = Math.min(stage.clientHeight, Math.max(0, ty));
    });

  })();
</script>
